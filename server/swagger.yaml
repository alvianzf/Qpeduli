openapi: 3.0.0
info:
  title: Qpeduli API
  version: "1.0.0"
  description: Community-driven crowdfunding API for Qpeduli.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /auth/register:
    post:
      summary: Register a new user
      responses:
        "201":
          description: Created
  /auth/login:
    post:
      summary: Log in
      responses:
        "200":
          description: OK
  /auth/me:
    get:
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /categories:
    get:
      summary: List forum categories
      responses:
        "200":
          description: OK
  /threads:
    get:
      summary: List threads, optionally filtered by category slug and aksi/diskusi
      responses:
        "200":
          description: OK
    post:
      summary: Create a thread (optionally as an Aksi Sosial campaign)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /threads/{id}:
    get:
      summary: Get a thread by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /campaigns/{id}/donate:
    post:
      summary: Record a pending donation
      responses:
        "201":
          description: Created
  /fjb:
    get:
      summary: List FJB Amal items
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
